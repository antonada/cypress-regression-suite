<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orderly regression reports</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f4f5f8;
        color: #1c2033;
      }
      main {
        max-width: 640px;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      p {
        color: #6b7086;
      }
      ul {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }
      a {
        display: block;
        padding: 1rem 1.25rem;
        background: #fff;
        border: 1px solid #e3e5ec;
        border-radius: 10px;
        color: #4f46e5;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        border-color: #4f46e5;
      }
      .source a {
        display: inline;
        padding: 0;
        border: 0;
        background: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Orderly regression reports</h1>
      <p>Latest run of the Cypress suite on the main branch, one report per browser.</p>
      <ul>
        <li><a href="chrome/">Chrome</a></li>
        <li><a href="firefox/">Firefox</a></li>
        <li><a href="edge/">Edge</a></li>
      </ul>
      <p class="source">
        Source code:
        <a href="https://github.com/antonada/cypress-regression-suite">github.com/antonada/cypress-regression-suite</a>
      </p>
    </main>
  </body>
</html>
